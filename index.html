<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>focus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #09090b;
    --text: #fafafa;
    --muted: #71717a;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .container {
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-size: clamp(2.5rem, 9vw, 5rem);
    font-weight: 600;
    letter-spacing: -0.05em;
    line-height: 1.05;
    margin-bottom: 1rem;
  }

  p {
    color: var(--muted);
    font-size: 1.1rem;
    font-weight: 400;
    max-width: 28rem;
    margin: 0 auto;
    line-height: 1.6;
  }

  .line {
    width: 48px;
    height: 2px;
    background: #3f3f46;
    margin: 2.5rem auto;
  }

  footer {
    position: absolute;
    bottom: 2rem;
    color: #3f3f46;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>stay focused</h1>
    <div class="line"></div>
    <p>One thing at a time.</p>
  </div>
  <footer>focus</footer>
</body>
</html>
